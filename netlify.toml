[build]
  command = "npm run verify:build"
  publish = ".next"

# Source uploads through the deployment API do not infer the Next.js runtime.
# Keep the adapter explicit so every build emits the server and edge handlers.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "zisi"

# Scheduled functions run in UTC and only on published production deploys.
[functions."inventory-reservation-cleanup"]
  schedule = "*/10 * * * *"

[functions."transactional-email-retry"]
  schedule = "*/10 * * * *"

[functions."loyverse-order-retry"]
  schedule = "*/15 * * * *"

[functions."loyverse-nightly-reconcile"]
  schedule = "0 7 * * *"

[functions."store-health-monitor"]
  schedule = "*/5 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://api.loyverse.com https://static.wixstatic.com data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src https://checkout.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# The Next.js runtime emits this function during the Netlify build. Keeping the
# route explicit makes both local CLI deploys and Netlify-hosted builds resolve
# application routes consistently while still preferring generated static files.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/___netlify-server-handler"
  status = 200
